<!DOCTYPE html>
<!-- Tells the browser this is an HTML5 page -->
<html lang="en">

<head>
  <!-- Allows all languages and special characters -->
  <meta charset="UTF-8" />

  <!-- Makes the page fit mobile and desktop screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Name shown in the browser tab -->
  <title>Sage AI</title>

  <!-- Fonts: Fraunces (headings) + Figtree (text) -->
  <!-- These two lines make the font download faster -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loads the fonts from Google Fonts (needs internet) -->
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet" />

  <!-- Connects the design file (colors, sizes, layout) -->
  <link rel="stylesheet" href="style.css" />

  <!-- marked.js: turns Markdown (like **bold**) into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- DOMPurify: removes dangerous code from the AI answer -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <!-- Chart.js: draws the sentiment pie chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Makes chart text readable on the dark background -->
  <script>
    // Color of the chart text
    Chart.defaults.color = "#d9d4ff";
    // Color of the chart lines
    Chart.defaults.borderColor = "#2e2760";
  </script>

  <!-- Loads the main JavaScript file after the page is ready -->
  <script defer src="script.js"></script>
</head>

<body>

  <!-- Left sidebar. Clicking a chat or "New chat" closes it on mobile -->
  <aside class="sidebar" id="sidebar"
    onclick="if (event.target.closest('li, .new-chat')) document.body.classList.remove('menu-open')">

    <!-- App logo and name -->
    <div class="brand">

      <!-- Glowing logo badge (decoration only, hidden from screen readers) -->
      <span class="brand-logo" aria-hidden="true">
        <!-- Sparkle icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z" /></svg>
      </span>

      <!-- App name -->
      <span class="brand-name">Sage AI</span>
    </div>

    <!-- Button to start a new chat (runs startNewChat() in script.js) -->
    <button class="new-chat" onclick="startNewChat()">
      <!-- Plus icon -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
      New Chat
    </button>

    <!-- Small title above the chat list -->
    <div class="history-label">Recent chats</div>

    <!-- Old chats are added here by JavaScript -->
    <ul class="chat-history" id="chat-history"></ul>

  </aside>

  <!-- Main chat area -->
  <main class="chat-container">

    <!-- Top part with the greeting -->
    <div class="chat-header">

      <!-- Menu button (visible only on mobile) opens the chat list -->
      <button class="menu-btn" aria-label="Open chat list"
        onclick="document.body.classList.toggle('menu-open')">
        <!-- Three-line menu icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>

      <!-- Big colorful greeting -->
      <span class="greeting">Hello, <span class="username">Jyoti</span></span>
    </div>

    <!-- Messages appear here. Keep it empty: CSS shows the welcome text -->
    <div class="chat-box" id="chat-box" aria-live="polite"></div>

    <!-- Bottom bar where the user types -->
    <div class="chat-input">

      <!-- Microphone button (does not work yet) -->
      <button class="mic-btn" aria-label="Voice input" title="Voice input">
        <!-- Microphone icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" /></svg>
      </button>

      <!-- Box where the user types the message -->
      <!-- Pressing a key runs handleKeyPress() (Enter sends the message) -->
      <input type="text" id="user-input" placeholder="Ask Sage anything"
        aria-label="Message" autocomplete="off" onkeypress="handleKeyPress(event)" />

      <!-- Send button (runs sendMessage() in script.js) -->
      <button id="send-btn" aria-label="Send message" onclick="sendMessage()">
        <!-- Up arrow icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 19V5" /></svg>
      </button>
    </div>

  </main>

</body>
</html>
